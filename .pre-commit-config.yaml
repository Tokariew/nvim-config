repos:
  - repo: https://github.com/JohnnyMorganz/stylua
    rev: v2.5.2
    hooks:
      - id: stylua
        args: ["--indent-type", "Spaces", "--indent-width", "2", "--column-width", "80"]
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      - id: check-json

      - id: pretty-format-json
        args:
          - --autofix
          - --no-ensure-ascii
